name: build-and-test
on:
  push:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: cd relay && go vet ./... && go test -race -count=1 ./...
      - name: Build relay programs (unsigned, for your own testing)
        run: |
          mkdir -p dist && cd relay
          for t in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../dist/ghost-relay-$os-$arch$ext" .
          done
          cd ../dist && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: relay-programs
          path: dist/

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Accept Android SDK licenses (SDK is preinstalled on this image)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Build and start the real relay (loopback, dev mode, synthetic secrets)
        run: |
          cd relay && go build -o "$RUNNER_TEMP/ghost-relay" .
          TOKEN="$(head -c 32 /dev/urandom | base64 | tr -d '\n=+/')"
          echo "::add-mask::$TOKEN"
          echo "GHOST_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          GHOST_ADMIN_TOKEN="$TOKEN" nohup "$RUNNER_TEMP/ghost-relay" -insecure-dev -addr 127.0.0.1:8443 -ip-rate 1000 -ip-burst 5000 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8443/healthz && break; sleep 1; done
          curl -sS -o /dev/null -w "relay health: %{http_code}\n" http://127.0.0.1:8443/healthz
      - name: Unit + integration tests (app, crypto core, two clients through the real relay)
        env:
          GHOST_RELAY_URL: http://127.0.0.1:8443
          GHOST_REQUIRE_RELAY: "1"
        run: |
          cd android
          set +e
          gradle --no-daemon --continue :core-crypto:test testDebugUnitTest --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          echo "gradle exit code: $code"
          if [ $code -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/explain_failure.py" "$RUNNER_TEMP/gradle.log"
          fi
          exit $code
      - name: Relay log must contain no message text, usernames or mailbox IDs
        if: always()
        run: |
          echo "relay log lines: $(wc -l < "$RUNNER_TEMP/relay.log")"
          if grep -Eq 'PLAINTEXT-MARKER|alice_|bob_|mallory_' "$RUNNER_TEMP/relay.log"; then
            echo "::error title=Relay log leak::relay log contains sensitive strings"; exit 1
          fi
          echo "::notice title=Relay log::clean ($(wc -c < "$RUNNER_TEMP/relay.log") bytes)"
      - name: Test summary (counts from XML reports)
        if: always()
        run: python3 .github/scripts/summarize_tests.py android
      - name: Debug APK
        run: cd android && gradle --no-daemon assembleDebug
      - name: Release build (R8 minify + resource shrink; unsigned)
        run: |
          cd android
          set +e
          gradle --no-daemon :app:assembleRelease --stacktrace > "$RUNNER_TEMP/release.log" 2>&1
          code=$?
          echo "release exit code: $code"
          if [ $code -ne 0 ]; then python3 "$GITHUB_WORKSPACE/.github/scripts/explain_failure.py" "$RUNNER_TEMP/release.log"; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/core-crypto/build/reports/tests/
            android/core-crypto/build/test-results/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  device-tests:
    # Real Android system image (emulator). Proves libsignal natives, Keystore signing and FLAG_SECURE
    # on Android; it is NOT a physical device and cannot test screen capture or hardware-backed security.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Build and start the real relay (loopback, dev mode, synthetic secrets)
        run: |
          cd relay && go build -o "$RUNNER_TEMP/ghost-relay" .
          TOKEN="$(head -c 32 /dev/urandom | base64 | tr -d '\n=+/')"
          echo "::add-mask::$TOKEN"
          echo "GHOST_ADMIN_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          GHOST_ADMIN_TOKEN="$TOKEN" nohup "$RUNNER_TEMP/ghost-relay" -insecure-dev -addr 127.0.0.1:8443 -ip-rate 1000 -ip-burst 5000 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8443/healthz && break; sleep 1; done
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/scripts/run_device_tests.sh
      - name: Device test summary
        if: always()
        run: python3 .github/scripts/summarize_tests.py android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: android/app/build/outputs/androidTest-results/
