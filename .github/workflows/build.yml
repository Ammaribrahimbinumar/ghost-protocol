# Place at: .github/workflows/build.yml (repo root). NOT YET RUN.
name: build-and-test
on:
  push:
  workflow_dispatch:

env:
  ROOT: "ghost_protocol file 001/ghost_protocol"

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: cd "$ROOT/relay" && go vet ./... && go test -race -count=1 ./...

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on this image)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests
        run: cd "$ROOT/android" && gradle --no-daemon testDebugUnitTest
      - name: Debug APK
        run: cd "$ROOT/android" && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            ghost_protocol file 001/ghost_protocol/android/app/build/reports/tests/
            ghost_protocol file 001/ghost_protocol/android/app/build/test-results/
            ghost_protocol file 001/ghost_protocol/android/app/build/outputs/apk/debug/*.apk
