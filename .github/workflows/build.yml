name: build-and-test
on:
  push:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: cd relay && go vet ./... && go test -race -count=1 ./...

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses (SDK is preinstalled on this image)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests (app + crypto core)
        run: |
          cd android
          set +e
          gradle --no-daemon --continue :core-crypto:test testDebugUnitTest --stacktrace > "$RUNNER_TEMP/gradle.log" 2>&1
          code=$?
          echo "gradle exit code: $code"
          if [ $code -ne 0 ]; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/explain_failure.py" "$RUNNER_TEMP/gradle.log"
          fi
          exit $code
      - name: Test summary (counts from XML reports)
        if: always()
        run: python3 .github/scripts/summarize_tests.py android
      - name: Debug APK
        run: cd android && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/core-crypto/build/reports/tests/
            android/core-crypto/build/test-results/
            android/app/build/outputs/apk/debug/*.apk
